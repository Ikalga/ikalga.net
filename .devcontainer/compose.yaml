services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      # node_modules はバインドマウントから切り離し、named volume に置く。
      # Windows ホストのファイルシステム経由だと I/O が遅く、依存パッケージの
      # ネイティブバイナリもホスト OS 向けのものと混ざるため。
      - node_modules:/workspace/node_modules
    ports:
      - '3000:3000'
    environment:
      # Windows ホストのバインドマウントではファイル変更イベントが
      # コンテナ内に伝播しないため、Vite の watch をポーリングに切り替える。
      VITE_USE_POLLING: 'true'
      # Nuxt Content の content/ 監視は chokidar が直接おこなっており、
      # モジュール側にポーリングの設定項目がない。chokidar 5 はこの環境変数を
      # 見てくれるので、ここで有効にする（これが無いと content/*.md を編集しても
      # dev サーバーに反映されない）。
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    command: sleep infinity

volumes:
  node_modules:
